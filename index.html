<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Vegetable Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="world">
    <div id="sky"></div>
    <div id="sun-moon"></div>
    <div id="clouds"></div>
    <div id="horizon"></div>
    <div id="ground"></div>
    <div id="ground-detail"></div>
    <div id="vegetable-container">
      <div id="vegetable"></div>
      <div id="vegetable-face">
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
      </div>
    </div>
    <div id="particles"></div>
    <div id="ambient-text"></div>
  </div>
  <div id="veggie-picker" class="hidden">
    <p>who are you today?</p>
    <div id="veggie-options"></div>
  </div>
  <script src="game.js"></script>
</body>
</html>
